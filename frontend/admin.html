<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Admin Dashboard - Add Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-full flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="h-10 w-10 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-lg shadow-lg shadow-indigo-500/30">
                    P
                </div>
                <div>
                    <h1 class="text-lg font-semibold tracking-tight">Portfolio Admin</h1>
                    <p class="text-xs text-slate-400">Remote Content Management</p>
                </div>
            </div>
            <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span>
                API Connected
            </span>
        </div>
    </header>

    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-8">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-xl overflow-hidden p-6 sm:p-8">
            <div class="mb-6 pb-6 border-b border-slate-800">
                <h2 class="text-xl font-bold text-white tracking-tight">Add New Project</h2>
                <p class="text-sm text-slate-400 mt-1">Fill in the details below to publish a new project directly to your Render backend database.</p>
            </div>

            <div id="toast" class="hidden mb-6 p-4 rounded-xl text-sm border flex items-start space-x-3 transition-all duration-300">
                <div id="toast-icon" class="flex-shrink-0 mt-0.5"></div>
                <div class="flex-grow">
                    <p id="toast-title" class="font-semibold"></p>
                    <p id="toast-message" class="text-xs mt-0.5 opacity-90"></p>
                </div>
            </div>

            <form id="project-form" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 p-4 rounded-xl bg-slate-950/50 border border-slate-800/80">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-2" for="api-url">
                            Backend API URL
                        </label>
                        <input 
                            type="url" 
                            id="api-url" 
                            value="https://personal-website-api-6xtp.onrender.com" 
                            required
                            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                        >
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-2" for="api-key">
                            Admin API Key <span class="text-indigo-400">*</span>
                        </label>
                        <input 
                            type="password" 
                            id="api-key" 
                            placeholder="Enter your ADMIN_API_KEY" 
                            required
                            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                        >
                    </div>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1.5" for="title">Project Title</label>
                        <input 
                            type="text" 
                            id="title" 
                            placeholder="e.g. AI Content Summarizer" 
                            required
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                        >
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1.5" for="description">Description</label>
                        <textarea 
                            id="description" 
                            rows="3" 
                            placeholder="Briefly describe what this project does and technologies used..." 
                            required
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all resize-y"
                        ></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1.5" for="tags">
                            Tags <span class="text-xs text-slate-500">(comma-separated)</span>
                        </label>
                        <input 
                            type="text" 
                            id="tags" 
                            placeholder="Python, FastAPI, Tailwind CSS, React" 
                            required
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                        >
                        <p class="text-xs text-slate-500 mt-1">Automatically converted into a JSON list for your database.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-1.5" for="demo-url">Demo URL</label>
                            <input 
                                type="url" 
                                id="demo-url" 
                                placeholder="https://my-demo-link.com" 
                                value="#"
                                class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                            >
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-1.5" for="github-url">GitHub URL</label>
                            <input 
                                type="url" 
                                id="github-url" 
                                placeholder="https://github.com/username/repo" 
                                value="#"
                                class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                            >
                        </div>
                    </div>
                </div>

                <div class="pt-4 flex items-center justify-end space-x-4">
                    <button 
                        type="reset" 
                        class="px-5 py-2.5 rounded-xl border border-slate-700 text-sm font-medium text-slate-300 hover:bg-slate-800 transition-all"
                    >
                        Reset Form
                    </button>
                    <button 
                        type="submit" 
                        id="submit-btn"
                        class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm shadow-lg shadow-indigo-600/30 transition-all flex items-center space-x-2"
                    >
                        <span>Publish Project</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                        </svg>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer class="border-t border-slate-800/80 bg-slate-900/30 py-4 text-center text-xs text-slate-500">
        Personal Website Portfolio Manager &bull; Secure Admin Client
    </footer>

    <!-- Linked separated JavaScript file -->
    <script src="admin.js" defer></script>
</body>
</html>
